<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' tauri: asset: data:;">
<title>Crop</title>
<style>
  :root {
    --bg: #f2f2f2; --surface: #ffffff; --line: rgba(0, 0, 0, .09); --ink: #111111; --sub: #6e6e73; --faint: #a1a1a6;
    --chip: rgba(0, 0, 0, .06); --invert: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0b0b0b; --surface: #161616; --line: rgba(255, 255, 255, .10); --ink: #f5f5f7; --sub: #98989d; --faint: #636366; --chip: rgba(255, 255, 255, .09); --invert: #111111; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden; user-select: none; }
  body { display: flex; flex-direction: column; font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif; font-size: 13px; -webkit-font-smoothing: antialiased; }

  /* Header doubles as the title bar; Windows draws min/max/close on the right (titleBarOverlay) */
  header { height: 44px; flex: none; display: flex; align-items: center; gap: 16px; padding: 0 150px 0 16px; background: var(--surface); border-bottom: 1px solid var(--line); -webkit-app-region: drag; }
  #name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
  #count { color: var(--sub); white-space: nowrap; }
  #ratios { display: flex; gap: 2px; margin-left: auto; -webkit-app-region: no-drag; }
  .ratio { border: 0; background: transparent; color: var(--sub); font: inherit; font-size: 12px; font-weight: 500; padding: 4px 9px; border-radius: 6px; cursor: pointer; }
  .ratio:hover { color: var(--ink); }
  .ratio.on { background: var(--chip); color: var(--ink); }

  main { flex: 1; position: relative; min-height: 0; }
  #frame { position: absolute; touch-action: none; cursor: crosshair; }
  #frame img { display: block; width: 100%; height: 100%; pointer-events: none; }
  /* The huge shadow darkens everything outside the selection; #clip keeps it inside the image.
     The box and its handles live outside #clip, so handles on the image edge stay fully grabbable. */
  #clip { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  #shade { position: absolute; box-shadow: 0 0 0 9999px rgba(0, 0, 0, .55); }
  #box { position: absolute; outline: 1px solid rgba(255, 255, 255, .95); cursor: move; }
  .third { position: absolute; background: rgba(255, 255, 255, .35); pointer-events: none; }
  .third.v { top: 0; bottom: 0; width: 1px; }
  .third.h { left: 0; right: 0; height: 1px; }
  .handle { position: absolute; width: 12px; height: 12px; margin: -6px 0 0 -6px; background: #fff; border-radius: 2px; box-shadow: 0 0 0 1px rgba(0, 0, 0, .35); }
  .handle[data-h="nw"], .handle[data-h="se"] { cursor: nwse-resize; }
  .handle[data-h="ne"], .handle[data-h="sw"] { cursor: nesw-resize; }
  .handle[data-h="n"], .handle[data-h="s"] { cursor: ns-resize; }
  .handle[data-h="e"], .handle[data-h="w"] { cursor: ew-resize; }
  body.locked .handle.edge { display: none; }

  footer { height: 56px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--surface); border-top: 1px solid var(--line); }
  #size { font-variant-numeric: tabular-nums; font-weight: 500; }
  #hint { color: var(--faint); font-size: 12px; }
  .spacer { flex: 1; }
  button.act { border: 0; font: inherit; font-weight: 600; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
  #cancel { background: var(--chip); color: var(--ink); }
  #save { background: var(--ink); color: var(--invert); }
  button.act:focus-visible, .ratio:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <span id="name"></span><span id="count"></span>
  <div id="ratios" role="group" aria-label="Aspect ratio">
    <button class="ratio on" data-r="0">Free</button>
    <button class="ratio" data-r="1">1:1</button>
    <button class="ratio" data-r="1.3333">4:3</button>
    <button class="ratio" data-r="1.5">3:2</button>
    <button class="ratio" data-r="1.7778">16:9</button>
    <button class="ratio" data-r="0.5625">9:16</button>
  </div>
</header>
<main>
  <div id="frame">
    <img id="img" alt="">
    <div id="clip"><div id="shade"></div></div>
    <div id="box"></div>
  </div>
</main>
<footer>
  <span id="size"></span>
  <span id="hint">Drag to select · Enter to save · Esc to cancel</span>
  <span class="spacer"></span>
  <button class="act" id="cancel">Cancel</button>
  <button class="act" id="save">Crop</button>
</footer>
<script src="bridge.js"></script>
<script>
  // Crop editor. The selection is kept normalized (0..1 of the image) so it can be applied to the
  // full-size original in main, and to several images at once.
  const $ = (id) => document.getElementById(id);
  const frame = $('frame'), box = $('box'), img = $('img');
  const MIN = 0.02; // smallest selection, as a fraction of the image
  let W = 1, H = 1; // full-size pixels (after EXIF orientation)
  let ratio = 0; // width / height in pixels; 0 = free
  let rect = { x: 0, y: 0, w: 1, h: 1 };
  let drag = null;

  // Build the thirds grid and the 8 handles
  box.replaceChildren();
  for (const [cls, pos] of [['v', 33.333], ['v', 66.667], ['h', 33.333], ['h', 66.667]]) {
    const d = document.createElement('div');
    d.className = `third ${cls}`;
    d.style[cls === 'v' ? 'left' : 'top'] = `${pos}%`;
    box.append(d);
  }
  const HANDLES = { nw: [0, 0], n: [50, 0], ne: [100, 0], e: [100, 50], se: [100, 100], s: [50, 100], sw: [0, 100], w: [0, 50] };
  for (const [h, [x, y]] of Object.entries(HANDLES)) {
    const d = document.createElement('div');
    d.className = `handle${h.length === 1 ? ' edge' : ''}`;
    d.dataset.h = h;
    d.style.left = `${x}%`;
    d.style.top = `${y}%`;
    box.append(d);
  }

  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

  // Fit the image into the stage, keeping its aspect ratio
  function layout() {
    const stage = frame.parentElement.getBoundingClientRect();
    const pad = 24;
    const scale = Math.min((stage.width - pad * 2) / W, (stage.height - pad * 2) / H);
    const w = Math.max(1, W * scale), h = Math.max(1, H * scale);
    Object.assign(frame.style, { width: `${w}px`, height: `${h}px`, left: `${(stage.width - w) / 2}px`, top: `${(stage.height - h) / 2}px` });
  }

  function paint() {
    const pos = { left: `${rect.x * 100}%`, top: `${rect.y * 100}%`, width: `${rect.w * 100}%`, height: `${rect.h * 100}%` };
    Object.assign(box.style, pos);
    Object.assign($('shade').style, pos);
    $('size').textContent = `${Math.round(rect.w * W)} × ${Math.round(rect.h * H)} px`;
  }

  // Largest centered selection with the chosen ratio
  function applyRatio(r) {
    ratio = r;
    document.body.classList.toggle('locked', r > 0);
    for (const b of document.querySelectorAll('.ratio')) b.classList.toggle('on', Number(b.dataset.r) === r);
    if (r > 0) {
      let w = 1, h = (W / r) / H;
      if (h > 1) { h = 1; w = (H * r) / W; }
      rect = { x: (1 - w) / 2, y: (1 - h) / 2, w, h };
    }
    paint();
  }

  const toNorm = (e) => {
    const b = frame.getBoundingClientRect();
    return { x: clamp((e.clientX - b.left) / b.width, 0, 1), y: clamp((e.clientY - b.top) / b.height, 0, 1) };
  };

  // Resize from a fixed anchor corner toward the pointer, honoring the ratio when one is set
  function fromAnchor(ax, ay, p) {
    let w = Math.max(MIN, Math.abs(p.x - ax));
    let h = Math.max(MIN, Math.abs(p.y - ay));
    const room = { w: p.x < ax ? ax : 1 - ax, h: p.y < ay ? ay : 1 - ay };
    if (ratio > 0) {
      h = (w * W) / (ratio * H);
      if (h > room.h) { h = room.h; w = (h * H * ratio) / W; }
    }
    w = Math.min(w, room.w);
    h = Math.min(h, room.h);
    return { x: p.x < ax ? ax - w : ax, y: p.y < ay ? ay - h : ay, w, h };
  }

  frame.addEventListener('pointerdown', (e) => {
    frame.setPointerCapture(e.pointerId);
    const p = toNorm(e);
    const handle = e.target.dataset && e.target.dataset.h;
    if (handle) drag = { kind: 'resize', handle, start: { ...rect } };
    else if (e.target === box || box.contains(e.target)) drag = { kind: 'move', p0: p, start: { ...rect } };
    else drag = { kind: 'draw', ax: p.x, ay: p.y }; // start a new selection
  });

  frame.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const p = toNorm(e);
    const s = drag.start;
    if (drag.kind === 'move') {
      rect = { ...s, x: clamp(s.x + p.x - drag.p0.x, 0, 1 - s.w), y: clamp(s.y + p.y - drag.p0.y, 0, 1 - s.h) };
    } else if (drag.kind === 'draw') {
      rect = fromAnchor(drag.ax, drag.ay, p);
    } else if (drag.handle.length === 2) {
      // Corner: the opposite corner stays put
      const ax = drag.handle.includes('w') ? s.x + s.w : s.x;
      const ay = drag.handle.includes('n') ? s.y + s.h : s.y;
      rect = fromAnchor(ax, ay, p);
    } else {
      // Edge (free ratio only): move just that side
      const r = { ...s };
      if (drag.handle === 'n') { r.y = clamp(p.y, 0, s.y + s.h - MIN); r.h = s.y + s.h - r.y; }
      if (drag.handle === 's') r.h = clamp(p.y - s.y, MIN, 1 - s.y);
      if (drag.handle === 'w') { r.x = clamp(p.x, 0, s.x + s.w - MIN); r.w = s.x + s.w - r.x; }
      if (drag.handle === 'e') r.w = clamp(p.x - s.x, MIN, 1 - s.x);
      rect = r;
    }
    paint();
  });

  frame.addEventListener('pointerup', () => { drag = null; });

  for (const b of document.querySelectorAll('.ratio')) b.addEventListener('click', () => applyRatio(Number(b.dataset.r)));

  const finish = (result) => window.shiftwheel.cropDone(result);
  $('cancel').addEventListener('click', () => finish(null));
  $('save').addEventListener('click', () => finish(rect));
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') finish(null);
    if (e.key === 'Enter') finish(rect);
  });
  window.addEventListener('resize', layout);

  window.shiftwheel.onCropInit((d) => {
    W = d.width;
    H = d.height;
    img.src = d.src;
    $('name').textContent = d.name;
    $('count').textContent = d.count > 1 ? `· same crop for ${d.count} images` : '';
    $('save').textContent = d.count > 1 ? `Crop ${d.count} images` : 'Crop';
    layout();
    applyRatio(0);
    $('save').focus();
  });
</script>
</body>
</html>
