<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' tauri: asset: data:;">
<title>Shiftwheel</title>
<link rel="stylesheet" href="theme.css">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none; cursor: default; }
  body { font-family: var(--mono); color: var(--ink); -webkit-font-smoothing: antialiased; }

  /* ---------- progress card ---------- */
  #card {
    position: absolute; right: 12px; bottom: 12px; width: 348px; box-sizing: border-box; padding: 12px 16px 14px;
    display: flex; flex-direction: column; gap: 8px; border-radius: 14px;
    background: var(--black); box-shadow: inset 0 0 0 1px var(--line), 0 16px 40px rgba(0, 0, 0, .5);
    transition: transform 160ms ease-out, opacity 160ms ease-out;
  }
  body.hidden #card, body.first #card { transform: translateY(8px); opacity: 0; pointer-events: none; }
  #top { display: flex; align-items: center; gap: 8px; min-width: 0; }
  #sub { flex: 1; min-width: 0; font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pct { font-size: 11px; color: var(--sub); font-variant-numeric: tabular-nums; }
  #main { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
  #count { font-family: var(--dot-font); font-size: 30px; font-weight: 900; line-height: 1; white-space: nowrap; }
  #count:empty { display: none; }
  #name { flex: 1; min-width: 0; font-size: 12px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bar { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 4px; }
  #bar i { width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
  #bar i.on { background: var(--ink); }
  #bar i.head { background: var(--red); }
  /* Unknown progress (LibreOffice, ffmpeg, OCR): a red dot runs along the row */
  #bar.busy i { animation: run 1.2s steps(1) infinite; }
  @keyframes run { 0%, 8% { background: var(--red); } 9%, 100% { background: var(--line); } }
  #detail { font-size: 11px; line-height: 1.45; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #detail:empty { display: none; }
  #show { display: none; font-size: 10.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }

  /* finished: inverted card, click to show in Explorer */
  body.done #card { background: var(--ink); color: var(--ground); box-shadow: 0 16px 40px rgba(0, 0, 0, .45); }
  body.done #sub, body.done #pct, body.done #detail { color: #4a4a4a; }
  body.done #name { color: var(--ground); }
  body.done #bar, body.info #bar, body.error #bar { display: none; }
  body.clickable #card { cursor: pointer; }
  body.clickable #show { display: block; }
  /* failed: red outline, the reason in red */
  body.error #card { box-shadow: inset 0 0 0 1px var(--red), 0 16px 40px rgba(0, 0, 0, .5); }
  body.error #sub { color: var(--ink); }
  body.error #sub::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 8px; border-radius: 50%; background: var(--red); vertical-align: 1px; }
  body.error #detail { color: var(--red-soft); white-space: normal; }

  /* ---------- first run ---------- */
  #first {
    position: absolute; right: 12px; bottom: 12px; width: 360px; box-sizing: border-box; padding: 20px;
    display: none; flex-direction: column; gap: 16px; border-radius: 16px;
    background: var(--black); box-shadow: inset 0 0 0 1px var(--line), 0 20px 50px rgba(0, 0, 0, .55);
  }
  body.first #first { display: flex; }
  #first header { display: flex; align-items: center; justify-content: space-between; }
  #first h1 { margin: 0; font-family: var(--dot-font); font-size: 30px; font-weight: 900; line-height: 1; }
  #first header span { width: 10px; height: 10px; border-radius: 50%; background: var(--red); }
  #first ol { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; font-size: 12px; line-height: 1.4; }
  #first li { display: flex; gap: 12px; }
  #first li b { font-weight: 700; }
  #first li > span:first-child { color: var(--mute); }
  #first hr { margin: 0; height: 1px; border: 0; background: repeating-linear-gradient(90deg, #3a3a3a 0 2px, transparent 2px 6px); }
  #first footer { display: flex; align-items: center; gap: 10px; }
  #first input { width: 16px; height: 16px; margin: 0; accent-color: var(--red); }
  #first label { font-size: 11.5px; letter-spacing: .5px; text-transform: uppercase; color: var(--sub); }
  #gotit { margin-left: auto; border: 0; padding: 10px 18px; border-radius: 999px; background: var(--ink); color: var(--ground); font: inherit; font-size: 12px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; }
  #gotit:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) { #bar.busy i { animation: none; } #card { transition: none; } }
</style>
</head>
<body class="hidden">
<div id="card" title="">
  <div id="top"><div id="sub"></div><div id="pct"></div></div>
  <div id="main"><div id="count"></div><div id="name"></div></div>
  <div id="bar"></div>
  <div id="detail"></div>
  <div id="show">Show in Explorer ↗</div>
</div>

<section id="first" aria-label="Welcome">
  <header><h1>READY</h1><span></span></header>
  <ol>
    <li><span>01</span><span>drag a file in Explorer</span></li>
    <li><span>02</span><span>tap <b>shift</b> · <b>ctrl</b> · <b>alt</b></span></li>
    <li><span>03</span><span>drop on a slice; the center cancels</span></li>
  </ol>
  <hr>
  <footer>
    <input id="autostart" type="checkbox">
    <label for="autostart">Start with Windows</label>
    <button id="gotit" type="button">Got it</button>
  </footer>
</section>

<script src="bridge.js"></script>
<script>
  // Progress card in the screen corner while the queue runs; also the one-time welcome card.
  const $ = (id) => document.getElementById(id);
  const DOTS = 24;
  const bar = $('bar');
  for (let i = 0; i < DOTS; i++) {
    const dot = document.createElement('i');
    dot.style.animationDelay = `${(i * 1.2) / DOTS}s`;
    bar.append(dot);
  }
  const dots = [...bar.children];

  window.shiftwheel.onHud((s) => {
    const body = document.body;
    body.classList.remove('hidden', 'first', 'done', 'error', 'info');
    if (s.state !== 'busy') body.classList.add(s.state);
    body.classList.toggle('clickable', Boolean(s.clickable));
    $('card').title = s.clickable ? 'Show in Explorer' : '';
    const busy = s.state === 'busy';
    $('sub').textContent = busy && s.total > 1 ? `${s.label}  ·  ${s.index} of ${s.total}` : s.label;
    $('count').textContent = s.total > 1 ? `${busy ? s.index : s.total}/${s.total}` : '';
    $('name').textContent = s.name;
    $('detail').textContent = s.detail || '';
    const known = typeof s.percent === 'number';
    $('pct').textContent = known && busy ? `${Math.round(s.percent * 100)}%` : '';
    bar.classList.toggle('busy', !known);
    const lit = known ? Math.round(s.percent * DOTS) : 0;
    dots.forEach((d, i) => {
      d.classList.toggle('on', known && i < lit);
      d.classList.toggle('head', known && busy && i === lit && lit < DOTS);
    });
  });

  // Click the finished card to see the result in Explorer
  $('card').addEventListener('click', () => {
    if (document.body.classList.contains('clickable')) window.shiftwheel.hudReveal();
  });

  window.shiftwheel.onHudHide(() => document.body.classList.add('hidden'));

  // ---------- first run ----------
  function showFirst(d) {
    if (!d) return;
    $('autostart').checked = Boolean(d.autostart);
    document.body.classList.remove('hidden', 'done', 'error', 'info', 'clickable');
    document.body.classList.add('first');
  }
  window.shiftwheel.onFirstRun(showFirst);
  window.shiftwheel.getFirstRun().then(showFirst).catch(() => {});
  $('gotit').addEventListener('click', () => {
    document.body.classList.remove('first');
    document.body.classList.add('hidden');
    window.shiftwheel.firstRunDone($('autostart').checked);
  });
</script>
</body>
</html>
