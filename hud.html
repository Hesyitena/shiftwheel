<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-7U5/4kGzHcAX0mx0C+/KvWBMq8JnKaV7Bn8Xh8gLocU='; style-src 'sha256-JoBd2Kv21WwzJejBavYPmUZiJ6X1SWtOkpFAJgazrY4='">
<title>Shiftwheel</title>
<style>
  :root {
    --card: #fbfaf7; --line: rgba(60, 45, 30, .13); --ink: #1f1d1a; --muted: #8b857b;
    --chip: #f2601d; --track: #ebe7e0; --shadow: rgba(48, 32, 16, .22);
  }
  @media (prefers-color-scheme: dark) {
    :root { --card: #2b2926; --line: rgba(0, 0, 0, .5); --ink: #f3f0ea; --muted: #9b958b; --track: #3b3833; --shadow: rgba(0, 0, 0, .6); }
  }
  html, body { margin: 0; width: 340px; height: 92px; background: transparent; overflow: hidden; user-select: none; cursor: default; }
  body { font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif; color: var(--ink); }
  #card {
    position: absolute; left: 10px; right: 10px; bottom: 12px; height: 64px; box-sizing: border-box;
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 0 14px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
    box-shadow: 0 10px 24px var(--shadow), 0 1px 2px var(--shadow);
    transition: transform 180ms cubic-bezier(.2, .9, .3, 1.15), opacity 180ms;
  }
  body.hidden #card { transform: translateY(14px); opacity: 0; }
  #chip {
    min-width: 34px; height: 34px; padding: 0 7px; box-sizing: border-box; border-radius: 8px; background: var(--chip); color: #fff;
    display: grid; place-items: center; font-size: 11px; font-weight: 700; letter-spacing: .4px;
  }
  #text { min-width: 0; }
  #name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sub { margin-top: 1px; font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #pct { font-size: 12px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: var(--track); }
  #bar i { position: absolute; top: 0; bottom: 0; left: 0; width: 0; background: var(--chip); transition: width 160ms linear; }
  /* Tanpa persentase (LibreOffice, sharp): potongan kecil yang bergerak */
  #bar.busy i { width: 28%; animation: busy 1.1s ease-in-out infinite; transition: none; }
  @keyframes busy { from { left: -28%; } to { left: 100%; } }
  @media (prefers-reduced-motion: reduce) { #bar.busy i { animation: none; left: 0; width: 100%; opacity: .35; } #card { transition: none; } }
</style>
</head>
<body class="hidden">
<div id="card">
  <div id="chip"></div>
  <div id="text"><div id="name"></div><div id="sub"></div></div>
  <div id="pct"></div>
  <div id="bar"><i></i></div>
</div>
<script>
  // Kartu progres kecil di pojok layar selama antrean berjalan
  const $ = (id) => document.getElementById(id);
  const fill = document.querySelector('#bar i');

  window.shiftwheel.onHud((s) => {
    document.body.classList.remove('hidden');
    $('chip').textContent = s.chip;
    $('name').textContent = s.name;
    $('sub').textContent = s.total > 1 ? `${s.label} · ${s.index} dari ${s.total}` : s.label;
    const known = typeof s.percent === 'number';
    $('bar').classList.toggle('busy', !known);
    fill.style.width = known ? `${Math.round(s.percent * 100)}%` : '';
    $('pct').textContent = known ? `${Math.round(s.percent * 100)}%` : '';
  });

  window.shiftwheel.onHudHide(() => document.body.classList.add('hidden'));
</script>
</body>
</html>
