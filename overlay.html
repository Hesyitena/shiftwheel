<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-UtMGJ7tBv63qMbM9VaYa/apTv+phNU/Qiij5TW+cVwM='; style-src 'sha256-OxP2gH9iQT/KuTFAQx8UOa/cJnvCIpqSucgMX3r+If0='">
<title>Shiftwheel</title>
<style>
  :root {
    --disc: rgba(232, 232, 236, .95); --disc-line: rgba(0, 0, 0, .06);
    --seg: url(#segLight); --text: #1d1d1f; --muted: #8e8e93;
    --center: #ffffff; --cap: rgba(255, 255, 255, .95);
    --shadow: rgba(0, 0, 0, .22); --accent: #ff5a1f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --disc: rgba(36, 36, 40, .95); --disc-line: rgba(255, 255, 255, .08);
      --seg: url(#segDark); --text: #f2f2f5; --muted: #9a9aa2;
      --center: #1c1c1f; --cap: rgba(30, 30, 34, .95); --shadow: rgba(0, 0, 0, .55);
    }
  }
  html, body { margin: 0; width: 360px; height: 400px; background: transparent; overflow: hidden; user-select: none; cursor: default; }
  svg { position: absolute; left: 0; top: 0; width: 360px; height: 360px; }
  .wheel { transform-origin: 180px 180px; }
  .wheel.pop { animation: pop 170ms cubic-bezier(.2, 1.4, .5, 1); }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .disc { fill: var(--disc); stroke: var(--disc-line); filter: drop-shadow(0 10px 22px var(--shadow)); }
  .seg path { fill: var(--seg); stroke: var(--seg); stroke-width: 8; stroke-linejoin: round; transition: fill 80ms, stroke 80ms; }
  .seg.hover path { fill: var(--accent); stroke: var(--accent); filter: drop-shadow(0 4px 10px rgba(255, 90, 31, .45)); }
  text { pointer-events: none; text-anchor: middle; dominant-baseline: central; font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif; }
  .seg text { fill: var(--text); font-size: 12px; font-weight: 700; letter-spacing: .3px; }
  .seg.hover text { fill: #ffffff; }
  .center circle { fill: var(--center); filter: drop-shadow(0 2px 6px var(--shadow)); }
  .center text { fill: var(--text); font-size: 15px; font-weight: 700; }
  .center.idle text { fill: var(--muted); font-size: 13px; font-weight: 500; }
  #caption {
    position: absolute; left: 50%; top: 356px; transform: translateX(-50%); white-space: nowrap;
    padding: 5px 12px; border-radius: 999px; background: var(--cap); color: var(--text);
    font: 600 12px "Segoe UI", sans-serif; box-shadow: 0 4px 14px var(--shadow);
  }
</style>
</head>
<body>
<svg viewBox="0 0 360 360" aria-label="Shiftwheel">
  <defs>
    <linearGradient id="segLight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ececf0"/></linearGradient>
    <linearGradient id="segDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#46464d"/><stop offset="1" stop-color="#323238"/></linearGradient>
  </defs>
  <g class="wheel">
    <circle class="disc" cx="180" cy="180" r="160"/>
    <g id="segs"></g>
    <g class="center idle"><circle cx="180" cy="180" r="50"/><text id="centerText" x="180" y="180">batal</text></g>
  </g>
</svg>
<div id="caption"></div>
<script>
  // Roda radial. Isi roda dikirim main (config); drop ditangani preload.js.
  const NS = 'http://www.w3.org/2000/svg';
  const C = 180, R = 152, r = 64, PAD = 4, GAP = 6;
  const HINT = {
    convert: 'Konversi  ·  Ctrl tools  ·  Alt aksi',
    tools: 'Tools  ·  Shift konversi  ·  Alt aksi',
    actions: 'Aksi file  ·  Shift konversi  ·  Ctrl tools',
  };

  const wheel = document.querySelector('.wheel');
  const segs = document.getElementById('segs');
  const center = document.querySelector('.center');
  const centerText = document.getElementById('centerText');
  const caption = document.getElementById('caption');
  const state = { config: null, mode: 'convert', category: null, count: 0 };
  let current = null;

  function el(tag, attrs, text) {
    const node = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    if (text) node.textContent = text;
    return node;
  }

  // Tebak kategori dari MIME yang diberi Windows saat drag (nama file belum terbaca di tahap ini)
  function categoryOf(types) {
    const t = types.find(Boolean) || '';
    if (t === 'application/pdf') return 'pdf';
    if (t.startsWith('image/')) return 'image';
    if (t.startsWith('audio/')) return 'audio';
    if (t.startsWith('video/')) return 'video';
    if (/spreadsheet|excel|csv/.test(t)) return 'sheet';
    if (/presentation|powerpoint/.test(t)) return 'slides';
    if (/word|opendocument\.text|rtf|^text\//.test(t)) return 'document';
    return 'unknown';
  }

  function items() {
    const { config, mode, category, count } = state;
    if (!config || !category) return null; // file belum masuk ke jendela
    if (mode === 'actions') return config.actions;
    const list = mode === 'convert' ? config.convert[category] || config.convert.fallback : config.tools[category] || [];
    return list.filter((item) => !item.multi || count > 1);
  }

  const point = (rad, deg) => [C + rad * Math.cos(deg * Math.PI / 180), C + rad * Math.sin(deg * Math.PI / 180)];

  // Segmen cincin dengan celah selebar GAP; sudut membulat dari stroke tebal (stroke-linejoin round)
  function segmentPath(a1, a2) {
    const ro = R - PAD, ri = r + PAD, d = GAP / 2 + PAD;
    const off = (rad) => Math.asin(Math.min(1, d / rad)) * 180 / Math.PI;
    const o1 = a1 + off(ro), o2 = a2 - off(ro), i1 = a1 + off(ri), i2 = a2 - off(ri);
    const f = (p) => p.map((v) => v.toFixed(1)).join(' ');
    return `M${f(point(ro, o1))}A${ro} ${ro} 0 ${o2 - o1 > 180 ? 1 : 0} 1 ${f(point(ro, o2))}` +
      `L${f(point(ri, i2))}A${ri} ${ri} 0 ${i2 - i1 > 180 ? 1 : 0} 0 ${f(point(ri, i1))}Z`;
  }

  function setCenter(label) {
    center.classList.toggle('idle', !label);
    centerText.textContent = label || 'batal';
  }

  function setHover(seg) {
    if (seg === current) return;
    if (current) current.classList.remove('hover');
    current = seg;
    if (seg) seg.classList.add('hover');
    setCenter(seg && seg.dataset.label);
    caption.textContent = seg ? seg.dataset.caption : HINT[state.mode];
  }

  function render() {
    current = null;
    segs.replaceChildren();
    setCenter(null);
    caption.textContent = HINT[state.mode];
    const list = items();
    if (!list) return setCenter('…');
    if (!list.length) {
      setCenter('—');
      caption.textContent = state.mode === 'tools' ? 'Tidak ada tools untuk file ini' : 'Tidak ada opsi';
      return;
    }
    const step = 360 / list.length;
    list.forEach((item, i) => {
      const mid = -90 + i * step;
      const g = el('g', { class: 'seg', 'data-id': item.id, 'data-label': item.label, 'data-caption': item.caption });
      g.append(el('path', { d: segmentPath(mid - step / 2, mid + step / 2) }));
      const [x, y] = point((R + r) / 2, mid);
      const words = item.label.toUpperCase().split(' ');
      const text = el('text', { x, y: y - (words.length - 1) * 7 });
      words.forEach((w, j) => text.append(el('tspan', { x, dy: j ? 14 : 0 }, w)));
      g.append(text);
      segs.append(g);
    });
  }

  document.addEventListener('dragover', (e) => {
    if (state.category === null) {
      const files = [...e.dataTransfer.items].filter((i) => i.kind === 'file');
      state.count = files.length;
      state.category = categoryOf(files.map((i) => i.type));
      render();
    }
    setHover(e.target.closest ? e.target.closest('[data-id]') : null);
  });
  document.addEventListener('dragleave', (e) => { if (!e.relatedTarget) setHover(null); });
  document.addEventListener('drop', () => setHover(null));

  window.shiftwheel.onConfig((config) => { state.config = config; render(); });

  // Roda muncul (fresh) atau berganti mode karena tombol lain diketuk
  window.shiftwheel.onShow(({ mode, fresh }) => {
    state.mode = mode;
    if (fresh) {
      state.category = null;
      state.count = 0;
      wheel.classList.remove('pop');
      void wheel.getBoundingClientRect();
      wheel.classList.add('pop');
    }
    render();
  });
</script>
</body>
</html>
