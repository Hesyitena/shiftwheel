[package]
name = "imgcore"
version = "0.1.0"
edition = "2024"
description = "Shiftwheel's CPU-heavy image work, kept in its own crate so it can be built for speed while the app is built for size."
publish = false

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif"] }
