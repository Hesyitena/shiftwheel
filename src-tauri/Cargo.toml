[package]
name = "shiftwheel"
version = "1.1.0"
description = "Convert files from a radial wheel: drag a file, tap Shift."
authors = ["Shiftwheel"]
edition = "2024"
rust-version = "1.90"

[workspace]
members = ["imgcore"]

[lib]
name = "app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-log = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif"] }
imgcore = { path = "imgcore" }
lopdf = { version = "0.46.0", default-features = false }

[dev-dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "image-png", "image-ico", "test"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_UI_Shell",
] }

[profile.dev]
debug = 0

[profile.release]
opt-level = 2
lto = false
codegen-units = 16
panic = "abort"
strip = true
